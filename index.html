<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Everything I've watched, played and used, scored out of 10. Movies, shows, games and gaming gear.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="favicon.ico">

  <!-- Link previews in Discord, messages and social apps -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maxim's Ratings">
  <meta property="og:title" content="Maxim's Ratings">
  <meta property="og:description" content="Everything I've watched, played and used, scored out of 10.">
  <meta property="og:url" content="https://maximsratings.com/">
  <meta property="og:image" content="https://maximsratings.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Maxim's Ratings over a wall of movie and game posters">
  <meta name="twitter:card" content="summary_large_image">
  <title>Maxim's Ratings</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome (no integrity to avoid blocking) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css?v=2.4.3">
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <button class="brand" type="button" data-section="home">Maxim's Ratings</button>
      <nav class="tabs" aria-label="Categories">
        <button class="tab" type="button" data-section="movies">Movies</button>
        <button class="tab" type="button" data-section="shows">Shows</button>
        <button class="tab" type="button" data-section="games">Games</button>
        <button class="tab" type="button" data-section="mice">Mice</button>
        <button class="tab" type="button" data-section="mousepads">Mousepads</button>
      </nav>
      <div class="global-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="globalSearch" type="search" placeholder="Search everything" aria-label="Search all ratings"
          autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="globalResults" aria-autocomplete="list">
        <button type="button" class="search-clear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        <div id="globalResults" class="global-results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <button id="globalSearchOpen" class="global-search-open" type="button" aria-label="Search all ratings">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main>
    <!-- Home section -->
    <section id="home" class="section home-page">
      <div class="hero">
        <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true"></div>
        <div class="hero-content">
          <h1>Maxim's Ratings</h1>
          <p class="hero-sub">Everything I've watched, played and used, scored out of 10.</p>
          <div class="hero-stats" id="heroStats"></div>
        </div>
      </div>
      <div id="homeRows" class="home-rows"></div>
    </section>

    <section id="movies" class="section category-page hidden" aria-labelledby="moviesTitle"></section>

    <section id="shows" class="section category-page hidden" aria-labelledby="showsTitle"></section>

    <section id="games" class="section category-page hidden" aria-labelledby="gamesTitle"></section>

    <section id="mice" class="section category-page hidden" aria-labelledby="miceTitle"></section>

    <section id="mousepads" class="section category-page hidden" aria-labelledby="mousepadsTitle"></section>
  </main>

  <dialog id="details" class="details" aria-labelledby="detailsTitle">
    <button id="detailsClose" class="details-close" type="button" aria-label="Close">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
    <div id="detailsBody" class="details-body"></div>
  </dialog>

  <footer id="siteFooter" class="site-footer">
    Ratings are pulled live from
    <a href="https://docs.google.com/spreadsheets/d/1yl4E9f5lV_RVF9NItBrW_KwwM41x6YVDKRFONByFZE4/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">my Google Sheet</a>.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js?v=2.4.2"></script>
</body>
</html>
