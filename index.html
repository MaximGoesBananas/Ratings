<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maxim's Ratings for movies, games and more.">
  <link rel="icon" href="favicon.ico">
  <title>Maxim's Ratings</title>

  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome (no integrity to avoid blocking) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css?v=2.0.1">
</head>
<body>
  <header id="topbar" class="topbar hidden">
    <div class="topbar-inner">
      <button class="brand" type="button" data-section="home">Maxim's Ratings</button>
      <nav class="tabs" aria-label="Categories">
        <button class="tab" type="button" data-section="movies">Movies</button>
        <button class="tab" type="button" data-section="shows">Shows</button>
        <button class="tab" type="button" data-section="games">Games</button>
        <button class="tab" type="button" data-section="mice">Mice</button>
        <button class="tab" type="button" data-section="mousepads">Mousepads</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Home section -->
    <section id="home" class="section">
      <h1>Maxim's Ratings</h1>
      <div class="categories">
        <button class="category-button" data-section="movies">
          <i class="fa-solid fa-film" aria-hidden="true"></i>
          <span>Movies</span>
        </button>

        <button class="category-button" data-section="shows">
          <i class="fa-solid fa-tv" aria-hidden="true"></i>
          <span>Shows</span>
        </button>

        <button class="category-button" data-section="games">
          <i class="fa-brands fa-steam" aria-hidden="true"></i>
          <span>Games</span>
        </button>

        <button class="category-button" data-section="mice">
          <i class="fa-solid fa-computer-mouse" aria-hidden="true"></i>
          <span>Mice</span>
        </button>

        <!-- Mousepads icon -->
        <button class="category-button" data-section="mousepads">
          <i class="fa-solid fa-tablet" aria-hidden="true"></i>
          <span>Mousepads</span>
        </button>
      </div>
    </section>

    <section id="movies" class="section category-page hidden" aria-labelledby="moviesTitle"></section>

    <section id="shows" class="section category-page hidden" aria-labelledby="showsTitle"></section>

    <section id="games" class="section category-page hidden" aria-labelledby="gamesTitle"></section>

    <section id="mice" class="section category-page hidden" aria-labelledby="miceTitle"></section>

    <section id="mousepads" class="section category-page hidden" aria-labelledby="mousepadsTitle"></section>
  </main>

  <footer id="siteFooter" class="site-footer hidden">
    Ratings are pulled live from
    <a href="https://docs.google.com/spreadsheets/d/1yl4E9f5lV_RVF9NItBrW_KwwM41x6YVDKRFONByFZE4/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">my Google Sheet</a>.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js?v=2.0.1"></script>
</body>
</html>
